name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stonebid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stonebid_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/stonebid_test
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      SEAL_SECRET: ci-seal-secret-with-at-least-32-characters
      PSEUDONYM_SECRET: ci-pseudonym-secret-with-at-least-32-chars
      CORS_ORIGIN: http://localhost:5173
      SEED_PASSWORD: stonebid123
      MCP_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate
        run: npx prisma migrate deploy

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

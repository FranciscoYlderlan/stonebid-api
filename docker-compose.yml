# Ambiente local: PostgreSQL + migração/seed + API.
# Uso: docker compose up --build
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stonebid
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d stonebid']
      interval: 5s
      timeout: 5s
      retries: 10

  # Roda as migrations e o seed (reexecutável) e termina.
  migrate:
    build: .
    command: ['sh', '-c', 'npx prisma migrate deploy && npm run db:seed']
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/stonebid
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-0123456789}
      SEAL_SECRET: ${SEAL_SECRET:-local-compose-seal-secret-change-me-0123}
      PSEUDONYM_SECRET: ${PSEUDONYM_SECRET:-local-compose-pseudonym-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SEED_PASSWORD: ${SEED_PASSWORD:-stonebid123}
      MCP_ENABLED: 'false'
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/stonebid
      HOST: 0.0.0.0
      PORT: 3333
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-0123456789}
      SEAL_SECRET: ${SEAL_SECRET:-local-compose-seal-secret-change-me-0123}
      PSEUDONYM_SECRET: ${PSEUDONYM_SECRET:-local-compose-pseudonym-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SEED_PASSWORD: ${SEED_PASSWORD:-stonebid123}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_API_KEY: ${MCP_API_KEY:-local-mcp-api-key-change-me}
    ports:
      - '3333:3333'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
